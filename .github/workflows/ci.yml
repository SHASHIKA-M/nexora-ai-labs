name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  studio:
    name: Studio API (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run platform test suite
        run: pytest -q

  blueprint:
    name: Generated application blueprint (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/codegen/blueprints/shopping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Seed database
        run: npm run db:seed
      - name: Test
        run: npm test
